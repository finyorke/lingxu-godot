name: Cloudflare Pages Direct Upload

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cloudflare_account_id:
        description: Optional Cloudflare account ID for this run. Overrides variables/secrets and skips /accounts lookup.
        required: false
        type: string
      cloudflare_project_name:
        description: Optional Pages project name for this run. Overrides CLOUDFLARE_PROJECT_NAME.
        required: false
        type: string
      cloudflare_branch:
        description: Optional Pages deployment branch. Defaults to main/current branch/pr-<number>.
        required: false
        type: string
      cloudflare_production_branch:
        description: Optional production branch used when auto-creating a Pages project. Defaults to main.
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Change this to the directory your build produces.
  BUILD_OUTPUT_DIR: dist
  WRANGLER_VERSION: 4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static output
        shell: bash
        run: |
          set -euo pipefail

          # Replace this step with project-specific build/test/export commands.
          # For Godot/Unity or other large builds, run smoke tests before upload.
          if [ -f package.json ]; then
            npm ci
            npm run build
          elif [ -d public ]; then
            rm -rf "$BUILD_OUTPUT_DIR"
            mkdir -p "$BUILD_OUTPUT_DIR"
            cp -R public/. "$BUILD_OUTPUT_DIR"/
          else
            echo "::error title=Configure build step::Replace the template build step with commands that create ${BUILD_OUTPUT_DIR}."
            exit 1
          fi

          if [ ! -d "$BUILD_OUTPUT_DIR" ]; then
            echo "::error title=Missing build output::${BUILD_OUTPUT_DIR} does not exist."
            exit 1
          fi

      - name: Check Cloudflare Pages file limits
        shell: bash
        run: |
          set -euo pipefail
          max_files=20000
          max_bytes=$((25 * 1024 * 1024))
          oversized=0
          file_count="$(find "$BUILD_OUTPUT_DIR" -type f | wc -l | tr -d ' ')"

          {
            echo "## Cloudflare Pages asset check"
            echo
            echo "- Build output: \`${BUILD_OUTPUT_DIR}\`"
            echo "- File count: ${file_count}/${max_files}"
            echo "- Single-file size limit: 25 MiB"
            echo
            echo "Largest exported files:"
            echo
            echo '```text'
            find "$BUILD_OUTPUT_DIR" -type f -printf '%s\t%p\n' \
              | sort -nr \
              | head -n 10 \
              | awk -F '\t' '{ printf "%.2f MiB\t%s\n", $1 / 1024 / 1024, $2 }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$file_count" -gt "$max_files" ]; then
            echo "::error title=Too many files::Cloudflare Pages Wrangler uploads support up to ${max_files} files."
            exit 1
          fi

          while IFS= read -r -d '' file; do
            size="$(stat -c%s "$file")"
            if [ "$size" -gt "$max_bytes" ]; then
              oversized=1
              mib="$(awk "BEGIN { printf \"%.2f\", $size / 1024 / 1024 }")"
              echo "::error file=${file},title=Cloudflare Pages file too large::${file} is ${mib} MiB. The single-file limit is 25 MiB."
            fi
          done < <(find "$BUILD_OUTPUT_DIR" -type f -print0)

          if [ "$oversized" -ne 0 ]; then
            {
              echo
              echo "One or more files are larger than 25 MiB. Compress or split the asset, reduce the web export size, or move large static files to Cloudflare R2 before deploying."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-build
          path: ${{ env.BUILD_OUTPUT_DIR }}
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-build
          path: ${{ env.BUILD_OUTPUT_DIR }}

      - name: Resolve Cloudflare Pages branch
        id: branch
        shell: bash
        env:
          MANUAL_BRANCH: ${{ github.event.inputs.cloudflare_branch || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          if [ -n "$MANUAL_BRANCH" ]; then
            branch="$MANUAL_BRANCH"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            branch="pr-${PR_NUMBER}"
          else
            branch="${GITHUB_REF_NAME}"
          fi

          echo "name=${branch}" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages branch: ${branch}" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Cloudflare deployment configuration
        id: config
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID_INPUT: ${{ github.event.inputs.cloudflare_account_id || '' }}
          CLOUDFLARE_PROJECT_NAME_INPUT: ${{ github.event.inputs.cloudflare_project_name || '' }}
          CLOUDFLARE_PRODUCTION_BRANCH_INPUT: ${{ github.event.inputs.cloudflare_production_branch || '' }}
          CLOUDFLARE_ACCOUNT_ID_CONFIG: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          CLOUDFLARE_PROJECT_NAME_CONFIG: ${{ vars.CLOUDFLARE_PROJECT_NAME || '' }}
          CLOUDFLARE_PRODUCTION_BRANCH_CONFIG: ${{ vars.CLOUDFLARE_PRODUCTION_BRANCH || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail

          sanitize_project_name() {
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g'
          }

          repo_name="${GITHUB_REPOSITORY#*/}"
          default_project_name="$(sanitize_project_name "$repo_name")"
          if [ -z "$default_project_name" ]; then
            default_project_name="pages-site"
          fi

          if [ -n "$CLOUDFLARE_PROJECT_NAME_INPUT" ]; then
            project_name="$CLOUDFLARE_PROJECT_NAME_INPUT"
            project_name_source="workflow_dispatch input"
          elif [ -n "$CLOUDFLARE_PROJECT_NAME_CONFIG" ]; then
            project_name="$CLOUDFLARE_PROJECT_NAME_CONFIG"
            project_name_source="GitHub Actions variable CLOUDFLARE_PROJECT_NAME"
          else
            project_name="$default_project_name"
            project_name_source="repository name default (${repo_name})"
          fi

          if [ -n "$CLOUDFLARE_PRODUCTION_BRANCH_INPUT" ]; then
            production_branch="$CLOUDFLARE_PRODUCTION_BRANCH_INPUT"
            production_branch_source="workflow_dispatch input"
          elif [ -n "$CLOUDFLARE_PRODUCTION_BRANCH_CONFIG" ]; then
            production_branch="$CLOUDFLARE_PRODUCTION_BRANCH_CONFIG"
            production_branch_source="GitHub Actions variable CLOUDFLARE_PRODUCTION_BRANCH"
          else
            production_branch="main"
            production_branch_source="default"
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            {
              echo "## Cloudflare setup required"
              echo
              echo "Missing GitHub Actions secret: \`CLOUDFLARE_API_TOKEN\`."
              echo
              echo "- New secret link: https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions/new"
              echo "- Variables link: https://github.com/${GITHUB_REPOSITORY}/settings/variables/actions"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::warning title=Cloudflare deploy skipped::Configure CLOUDFLARE_API_TOKEN to enable same-repo PR preview deployments."
              exit 0
            fi

            echo "::error title=Missing GitHub secret::Set CLOUDFLARE_API_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -n "$CLOUDFLARE_ACCOUNT_ID_INPUT" ]; then
            account_id="$CLOUDFLARE_ACCOUNT_ID_INPUT"
            account_id_source="workflow_dispatch input"
          elif [ -n "$CLOUDFLARE_ACCOUNT_ID_CONFIG" ]; then
            account_id="$CLOUDFLARE_ACCOUNT_ID_CONFIG"
            account_id_source="GitHub Actions variable/secret CLOUDFLARE_ACCOUNT_ID"
          else
            accounts_response="$(mktemp)"
            curl -sS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts" \
              > "$accounts_response"

            set +e
            account_id="$(
              python3 - "$accounts_response" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          response_path = sys.argv[1]
          summary_path = sys.argv[2]

          def write_summary(lines):
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines))
                  handle.write("\n")

          try:
              with open(response_path, encoding="utf-8") as handle:
                  payload = json.load(handle)
          except Exception as exc:
              print(f"Cloudflare accounts response was not valid JSON: {exc}", file=sys.stderr)
              write_summary([
                  "## Cloudflare account resolution failed",
                  "",
                  "The `/accounts` response was not valid JSON. Configure `CLOUDFLARE_ACCOUNT_ID` explicitly or check the API token.",
              ])
              raise SystemExit(1)

          if not payload.get("success"):
              errors = payload.get("errors") or []
              messages = [error.get("message", "Unknown Cloudflare API error") for error in errors]
              message = "; ".join(messages) or "Cloudflare accounts API did not return success."
              print(message, file=sys.stderr)
              write_summary([
                  "## Cloudflare account resolution failed",
                  "",
                  message,
                  "",
                  "Configure `CLOUDFLARE_ACCOUNT_ID`, or use a token with `Account Settings Read` access.",
              ])
              raise SystemExit(1)

          accounts = payload.get("result") or []
          visible = [(account.get("id", ""), account.get("name", "")) for account in accounts if account.get("id")]

          if len(visible) == 1:
              print(visible[0][0])
              raise SystemExit(0)

          if visible:
              print("Multiple Cloudflare accounts are visible to this API token:", file=sys.stderr)
              rows = [
                  "## Cloudflare account selection required",
                  "",
                  "This token can see multiple accounts. The workflow will not guess. Configure `CLOUDFLARE_ACCOUNT_ID` or rerun manually with `cloudflare_account_id`.",
                  "",
                  "| Account name | Account ID |",
                  "| --- | --- |",
              ]
              for account_id, account_name in visible:
                  print(f"  {account_name}\t{account_id}", file=sys.stderr)
                  rows.append(f"| {account_name or '(unnamed)'} | `{account_id}` |")
              write_summary(rows)
              raise SystemExit(1)

          print("No Cloudflare accounts are visible to this API token.", file=sys.stderr)
          write_summary([
              "## Cloudflare account resolution failed",
              "",
              "No Cloudflare accounts are visible to this API token. Configure `CLOUDFLARE_ACCOUNT_ID` explicitly, or add `Account Settings Read` to the token.",
          ])
          raise SystemExit(1)
          PY
            )"
            parse_status="$?"
            set -e

            if [ "$parse_status" -ne 0 ]; then
              echo "::error title=Unable to resolve Cloudflare account::Set CLOUDFLARE_ACCOUNT_ID as a repository variable/secret, or use a token that can list exactly one account."
              exit 1
            fi

            account_id_source="Cloudflare /accounts API (single visible account)"
          fi

          project_url="https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects/${project_name}"
          project_response="$(mktemp)"
          project_status="$(
            curl -sS \
              -w "%{http_code}" \
              -o "$project_response" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$project_url"
          )"

          if [ "$project_status" = "200" ]; then
            project_action="found"
          elif [ "$project_status" = "404" ]; then
            create_payload="$(
              project_name="$project_name" production_branch="$production_branch" python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "name": os.environ["project_name"],
              "production_branch": os.environ["production_branch"],
          }))
          PY
            )"

            project_status="$(
              curl -sS \
                -w "%{http_code}" \
                -o "$project_response" \
                -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$create_payload" \
                "https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects"
            )"

            if [ "$project_status" != "200" ] && [ "$project_status" != "201" ]; then
              python3 - "$project_response" <<'PY'
          import json
          import sys

          try:
              payload = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("Cloudflare project creation failed and the response was not JSON.", file=sys.stderr)
              raise SystemExit(0)

          for error in payload.get("errors") or []:
              print(error.get("message", "Unknown Cloudflare API error"), file=sys.stderr)
          PY
              echo "::error title=Unable to create Cloudflare Pages project::Check token Pages Edit access and project name."
              exit 1
            fi

            if ! python3 - "$project_response" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if not payload.get("success"):
              for error in payload.get("errors") or []:
                  print(error.get("message", "Unknown Cloudflare API error"), file=sys.stderr)
              raise SystemExit(1)
          PY
            then
              echo "::error title=Unable to create Cloudflare Pages project::Cloudflare API returned an unsuccessful response."
              exit 1
            fi

            project_action="created"
          else
            python3 - "$project_response" <<'PY'
          import json
          import sys

          try:
              payload = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("Cloudflare project lookup failed and the response was not JSON.", file=sys.stderr)
              raise SystemExit(0)

          for error in payload.get("errors") or []:
              print(error.get("message", "Unknown Cloudflare API error"), file=sys.stderr)
          PY
            echo "::error title=Unable to verify Cloudflare Pages project::Check account ID, project name, and token permissions."
            exit 1
          fi

          {
            echo "## Cloudflare deployment configuration"
            echo
            echo "- Account ID source: ${account_id_source}"
            echo "- Account ID: ${account_id}"
            echo "- Project name source: ${project_name_source}"
            echo "- Project name: ${project_name}"
            echo "- Production branch source: ${production_branch_source}"
            echo "- Production branch: ${production_branch}"
            echo "- Deploy branch: ${CLOUDFLARE_BRANCH}"
            echo "- Pages project: ${project_action}"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "configured=true"
            echo "account_id=${account_id}"
            echo "project_name=${project_name}"
            echo "production_branch=${production_branch}"
            echo "project_action=${project_action}"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.config.outputs.configured == 'true'
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.config.outputs.account_id }}
          CLOUDFLARE_PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          CLOUDFLARE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          output_file="$(mktemp)"

          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy "$BUILD_OUTPUT_DIR" \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$CLOUDFLARE_BRANCH" \
            | tee "$output_file"

          deployment_url="$(grep -Eo 'https://[^ ]+\.pages\.dev[^ ]*' "$output_file" | head -n 1 || true)"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

          {
            echo "## Cloudflare Pages deployment"
            echo
            echo "- Project: ${CLOUDFLARE_PROJECT_NAME}"
            echo "- Branch: ${CLOUDFLARE_BRANCH}"
            if [ -n "$deployment_url" ]; then
              echo "- URL: ${deployment_url}"
            else
              echo "- URL: Check the Wrangler output above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on pull request
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          CLOUDFLARE_BRANCH: ${{ steps.branch.outputs.name }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const body = [
              marker,
              `Cloudflare Pages preview for \`${process.env.CLOUDFLARE_BRANCH}\`: ${process.env.DEPLOYMENT_URL}`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
