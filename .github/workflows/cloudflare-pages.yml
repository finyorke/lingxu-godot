name: Cloudflare Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cloudflare_branch:
        description: Optional Cloudflare Pages branch name. Leave empty to use main, the current branch, or pr-<number>.
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.2-stable
  GODOT_TEMPLATE_VERSION: 4.6.2.stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/

      - name: Install font subset tool
        run: |
          python3 -m venv build/fonttools-venv
          build/fonttools-venv/bin/python -m pip install --upgrade pip
          build/fonttools-venv/bin/python -m pip install fonttools

      - name: Prepare font subsets for Web export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/cloudflare

          find Data Scenes Scripts assets -type f \
            \( -name '*.gd' -o -name '*.json' -o -name '*.tscn' -o -name '*.tres' -o -name '*.import' \) \
            -print0 \
            | xargs -0 cat > build/cloudflare/font-subset-text.txt

          cat >> build/cloudflare/font-subset-text.txt <<'EOF'
          御剑灵墟 灵根 五行 金木水火土 风雷冰毒 剑 法器 商店 继续 开始 暂停 失败 胜利
          ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789
          !@#$%^&*()_+-=[]{};':",.<>/?\|`~，。？！：；、“”‘’（）《》【】—…
          EOF

          build/fonttools-venv/bin/python -m fontTools.subset assets/fonts/NotoSansCJKsc-Regular.otf \
            --text-file=build/cloudflare/font-subset-text.txt \
            --layout-features='*' \
            --glyph-names \
            --symbol-cmap \
            --legacy-cmap \
            --notdef-glyph \
            --notdef-outline \
            --recommended-glyphs \
            --output-file=build/cloudflare/NotoSansCJKsc-Regular.otf

          build/fonttools-venv/bin/python -m fontTools.subset assets/fonts/MaShanZheng-Regular.ttf \
            --text-file=build/cloudflare/font-subset-text.txt \
            --layout-features='*' \
            --glyph-names \
            --symbol-cmap \
            --legacy-cmap \
            --notdef-glyph \
            --notdef-outline \
            --recommended-glyphs \
            --output-file=build/cloudflare/MaShanZheng-Regular.ttf

          mv build/cloudflare/NotoSansCJKsc-Regular.otf assets/fonts/NotoSansCJKsc-Regular.otf
          mv build/cloudflare/MaShanZheng-Regular.ttf assets/fonts/MaShanZheng-Regular.ttf
          ls -lh assets/fonts/NotoSansCJKsc-Regular.otf assets/fonts/MaShanZheng-Regular.ttf

      - name: Import assets
        run: godot --headless --import --quit

      - name: Smoke test
        run: godot --headless --script tests/smoke.gd

      - name: Export Web build
        run: |
          rm -rf build/web
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
          echo "${GITHUB_SHA}" > build/web/version.txt

      - name: Prepare Cloudflare Pages asset handling
        shell: bash
        run: |
          set -euo pipefail

          gzip -9 -n < build/web/index.wasm > build/web/index.wasm.gz
          mv build/web/index.wasm.gz build/web/index.wasm

          cat > build/web/_worker.js <<'EOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              const response = await env.ASSETS.fetch(request);

              if (url.pathname === "/index.wasm") {
                const headers = new Headers(response.headers);
                headers.set("Content-Type", "application/wasm");
                headers.set("Content-Encoding", "gzip");
                headers.set("Cache-Control", "public, max-age=31536000, immutable");
                return new Response(response.body, {
                  status: response.status,
                  statusText: response.statusText,
                  headers,
                  encodeBody: "manual",
                });
              }

              if (url.pathname === "/index.pck") {
                const headers = new Headers(response.headers);
                headers.set("Content-Type", "application/octet-stream");
                headers.set("Cache-Control", "public, max-age=31536000, immutable");
                return new Response(response.body, {
                  status: response.status,
                  statusText: response.statusText,
                  headers,
                });
              }

              return response;
            },
          };
          EOF

      - name: Check Cloudflare Pages file limits
        shell: bash
        run: |
          set -euo pipefail
          max_bytes=$((25 * 1024 * 1024))
          oversized=0

          {
            echo "## Cloudflare Pages file size check"
            echo
            echo "Cloudflare Pages accepts site assets up to 25 MiB per file."
            echo
            echo "Largest exported files:"
            echo
            echo '```text'
            find build/web -type f -printf '%s\t%p\n' \
              | sort -nr \
              | head -n 10 \
              | awk -F '\t' '{ printf "%.2f MiB\t%s\n", $1 / 1024 / 1024, $2 }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r -d '' file; do
            size=$(stat -c%s "$file")
            if [ "$size" -gt "$max_bytes" ]; then
              oversized=1
              mib=$(awk "BEGIN { printf \"%.2f\", $size / 1024 / 1024 }")
              echo "::error file=${file},title=Cloudflare Pages file too large::${file} is ${mib} MiB. The single-file limit is 25 MiB."
            fi
          done < <(find build/web -type f -print0)

          if [ "$oversized" -ne 0 ]; then
            {
              echo
              echo "One or more files are larger than 25 MiB. Compress or split the asset, reduce the Godot export size, or move large static files to Cloudflare R2 before deploying."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-cloudflare-pages
          path: build/web
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Download Web build artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-web-cloudflare-pages
          path: build/web

      - name: Resolve Cloudflare Pages branch
        id: branch
        shell: bash
        env:
          MANUAL_BRANCH: ${{ github.event.inputs.cloudflare_branch || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          if [ -n "$MANUAL_BRANCH" ]; then
            branch="$MANUAL_BRANCH"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            branch="pr-${PR_NUMBER}"
          else
            branch="${GITHUB_REF_NAME}"
          fi

          echo "name=${branch}" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages branch: ${branch}" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Cloudflare deployment configuration
        id: config
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'lingxu-godot' }}
          CLOUDFLARE_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PRODUCTION_BRANCH || 'main' }}
        run: |
          set -euo pipefail
          missing=0
          missing_annotation="error"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            missing_annotation="warning"
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::${missing_annotation} title=Missing GitHub secret::Set CLOUDFLARE_API_TOKEN in Settings > Secrets and variables > Actions."
            missing=1
          fi

          if [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "::${missing_annotation} title=Missing GitHub variable::Set CLOUDFLARE_PROJECT_NAME, or keep the default project name lingxu-godot."
            missing=1
          fi

          if [ -z "$CLOUDFLARE_PRODUCTION_BRANCH" ]; then
            echo "::${missing_annotation} title=Missing GitHub variable::Set CLOUDFLARE_PRODUCTION_BRANCH, or keep the default production branch main."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            {
              echo "## Cloudflare setup required"
              echo
              echo "Before this workflow can deploy, configure the required repository value:"
              echo
              echo "- Secret: CLOUDFLARE_API_TOKEN"
              echo
              echo "Optional repository values:"
              echo
              echo "- Secret or variable: CLOUDFLARE_ACCOUNT_ID, only needed when the token cannot resolve exactly one Cloudflare account"
              echo "- Variable: CLOUDFLARE_PROJECT_NAME, defaulting to lingxu-godot"
              echo "- Variable: CLOUDFLARE_PRODUCTION_BRANCH, defaulting to main"
              echo
              echo "See Docs/CLOUDFLARE_PAGES_WORKFLOW.md for the exact Cloudflare and GitHub steps."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::warning title=Cloudflare deploy skipped::Configure CLOUDFLARE_API_TOKEN to enable PR preview deployments."
              exit 0
            fi

            exit 1
          fi

          account_id="$CLOUDFLARE_ACCOUNT_ID_INPUT"
          if [ -z "$account_id" ]; then
            accounts_response="$(mktemp)"
            curl -sS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts" \
              > "$accounts_response"

            if ! account_id="$(python3 - "$accounts_response" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  payload = json.load(handle)
          except Exception as exc:
              print(f"Cloudflare accounts response was not valid JSON: {exc}", file=sys.stderr)
              raise SystemExit(1)

          if not payload.get("success"):
              errors = payload.get("errors") or []
              messages = "; ".join(error.get("message", "Unknown Cloudflare API error") for error in errors)
              print(messages or "Cloudflare accounts API did not return success.", file=sys.stderr)
              raise SystemExit(1)

          accounts = payload.get("result") or []
          if len(accounts) == 1 and accounts[0].get("id"):
              print(accounts[0]["id"])
              raise SystemExit(0)

          if not accounts:
              print("No Cloudflare accounts are visible to this API token.", file=sys.stderr)
          else:
              print("Multiple Cloudflare accounts are visible to this API token:", file=sys.stderr)
              for account in accounts:
                  print(f"  {account.get('id', '')}\t{account.get('name', '')}", file=sys.stderr)
          raise SystemExit(1)
          PY
            )"; then
              echo "::error title=Unable to resolve Cloudflare account::Set CLOUDFLARE_ACCOUNT_ID as a repository secret or variable, or use a token that can list exactly one account."
              exit 1
            fi
          fi

          project_url="https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          project_response="$(mktemp)"
          project_status="$(
            curl -sS \
              -w "%{http_code}" \
              -o "$project_response" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$project_url"
          )"

          if [ "$project_status" = "200" ]; then
            project_action="found"
          elif [ "$project_status" = "404" ]; then
            create_payload="$(
              python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "name": os.environ["CLOUDFLARE_PROJECT_NAME"],
              "production_branch": os.environ["CLOUDFLARE_PRODUCTION_BRANCH"],
          }))
          PY
            )"
            project_status="$(
              curl -sS \
                -w "%{http_code}" \
                -o "$project_response" \
                -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$create_payload" \
                "https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects"
            )"

            if [ "$project_status" != "200" ] && [ "$project_status" != "201" ]; then
              python3 - "$project_response" <<'PY'
          import json
          import sys

          try:
              payload = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("Cloudflare project creation failed and the response was not JSON.", file=sys.stderr)
              raise SystemExit(0)

          errors = payload.get("errors") or []
          for error in errors:
              print(error.get("message", "Unknown Cloudflare API error"), file=sys.stderr)
          PY
              echo "::error title=Unable to create Cloudflare Pages project::Check that CLOUDFLARE_API_TOKEN has Pages Write/Edit access for the resolved account."
              exit 1
            fi

            if ! python3 - "$project_response" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if not payload.get("success"):
              errors = payload.get("errors") or []
              for error in errors:
                  print(error.get("message", "Unknown Cloudflare API error"), file=sys.stderr)
              raise SystemExit(1)
          PY
            then
              echo "::error title=Unable to create Cloudflare Pages project::Cloudflare API returned an unsuccessful response."
              exit 1
            fi

            project_action="created"
          else
            python3 - "$project_response" <<'PY'
          import json
          import sys

          try:
              payload = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("Cloudflare project lookup failed and the response was not JSON.", file=sys.stderr)
              raise SystemExit(0)

          errors = payload.get("errors") or []
          for error in errors:
              print(error.get("message", "Unknown Cloudflare API error"), file=sys.stderr)
          PY
            echo "::error title=Unable to verify Cloudflare Pages project::Check the resolved account ID and token permissions."
            exit 1
          fi

          {
            echo "CLOUDFLARE_ACCOUNT_ID=${account_id}"
            echo "CLOUDFLARE_PROJECT_NAME=${CLOUDFLARE_PROJECT_NAME}"
            echo "CLOUDFLARE_PRODUCTION_BRANCH=${CLOUDFLARE_PRODUCTION_BRANCH}"
          } >> "$GITHUB_ENV"

          {
            echo "## Cloudflare deployment configuration"
            echo
            echo "- Account ID: ${account_id}"
            echo "- Project: ${CLOUDFLARE_PROJECT_NAME} (${project_action})"
            echo "- Production branch: ${CLOUDFLARE_PRODUCTION_BRANCH}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.config.outputs.configured == 'true'
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          output_file="$(mktemp)"

          npx --yes wrangler@4 pages deploy build/web \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$CLOUDFLARE_BRANCH" \
            | tee "$output_file"

          deployment_url="$(grep -Eo 'https://[^ ]+\.pages\.dev[^ ]*' "$output_file" | head -n 1 || true)"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

          {
            echo "## Cloudflare Pages deployment"
            echo
            echo "- Project: ${CLOUDFLARE_PROJECT_NAME}"
            echo "- Branch: ${CLOUDFLARE_BRANCH}"
            if [ -n "$deployment_url" ]; then
              echo "- URL: ${deployment_url}"
            else
              echo "- URL: Check the Wrangler output above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on pull request
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          CLOUDFLARE_BRANCH: ${{ steps.branch.outputs.name }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const body = [
              marker,
              `Cloudflare Pages preview for \`${process.env.CLOUDFLARE_BRANCH}\`: ${process.env.DEPLOYMENT_URL}`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
